plugins {
  id 'java'
  id 'scala'
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.apache.spark:spark-core_2.11:2.3.0'
  implementation 'org.apache.spark:spark-sql_2.11:2.3.0'
  implementation 'org.apache.spark:spark-streaming_2.11:2.3.0'
  implementation 'org.apache.spark:spark-mllib_2.11:2.3.0'
  implementation 'org.scala-lang:scala-library:2.11.12'
  implementation 'org.scala-lang:scala-compiler:2.11.12'
  implementation 'com.twitter:parquet-hadoop-bundle:1.6.0'
  implementation 'org.apache.hadoop:hadoop-client:2.7.3'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.scalatest:scalatest_2.11:3.0.5'
}

// Note: archiveBaseName and sourceCompatibility commented out for Gradle 9.x compatibility
// These can be configured in the publishing section if needed